body{margin:0;font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;-webkit-font-smoothing:antialiased}

.page-header p{margin:0;font-size:.95rem;color:#64748b;line-height:1.5}

const COLORS = {
  person: { background: '#FF6F61', border: '#D32F2F' },
  venue:  { background: '#5C6BC0', border: '#3949AB' },
  edge:   'rgba(144,164,174,0.38)'
};

const SECTOR_COLORS = {
  'Visual Art': { background: '#E91E63', border: '#C2185B' },
  'Craft & Making': { background: '#FF9800', border: '#F57C00' },
  'Performing Arts': { background: '#9C27B0', border: '#7B1FA2' },
  'Music': { background: '#00BCD4', border: '#0097A7' },
  'Literature & Words': { background: '#8BC34A', border: '#689F38' },
  'Community & Education': { background: '#FFEB3B', border: '#F9A825' },
  'Heritage & Museums': { background: '#795548', border: '#5D4037' },
  'Media & Broadcast': { background: '#607D8B', border: '#455A64' },
  'Events & Festivals': { background: '#F44336', border: '#D32F2F' },
  'Dance': { background: '#EC407A', border: '#C2185B' },
  'Film & Screen': { background: '#26A69A', border: '#00897B' },
  'Public & Outdoor': { background: '#66BB6A', border: '#43A047' },
  'Enterprise & Admin': { background: '#7E57C2', border: '#5E35B1' },
  'Other': { background: '#90A4AE', border: '#607D8B' }
};

function getSector(tag) {
  const t = tag.toLowerCase();
  if (/visual art|painting|oil painting|drawing|illustration|gallery|exhibitions|public art|installation|murals|sign writing|cyanotype|2d animation|contemporary visual|mixed media|children.?s art|eco art|natural dyes|artist studio|creative workspace|atrium|sculpture/.test(t)) return 'Visual Art';
  if (/craft|crochet|weaving|spinning|willow|textiles|metalwork|pewter|dry stone|letter carving|stone carving|diy|irish-made|irish craft/.test(t)) return 'Craft & Making';
  if (/theatre|drama|puppetry|storytelling|directing|producing|site-specific|digital theatre|comedy|performance(?! dance)|stage management|mc/.test(t)) return 'Performing Arts';
  if (/music|recording|song|traditional music|sound engineering|comhaltas|music generation|music production|residential recording/.test(t)) return 'Music';
  if (/writing|literature|poetry|spoken word|storytelling/.test(t) && !/theatre|puppet/.test(t)) return 'Literature & Words';
  if (/community|education|youth|workshops|classes|talks|inclusion|participation|artist support|funding|policy|cultural programming|creative development|creativity|administration/.test(t)) return 'Community & Education';
  if (/heritage|museum|castle|history|military|interpretation|local history|collections|barracks|belvedere|moate|athlone castle/.test(t)) return 'Heritage & Museums';
  if (/radio|broadcast|media|social media|sound engineering/.test(t)) return 'Media & Broadcast';
  if (/festival|events|event promotion|event décor|culture night|cultural events|cultural activity/.test(t)) return 'Events & Festivals';
  if (/dance|choreography|dance teaching|céilí/.test(t)) return 'Dance';
  if (/film|cinema|screen/.test(t)) return 'Film & Screen';
  if (/outdoor|gardens|public art|waterfront|cultural quarter|architecture/.test(t)) return 'Public & Outdoor';
  if (/enterprise|creative businesses|incubation|arts development|westmeath arts|westmeath culture|creative ireland/.test(t)) return 'Enterprise & Admin';
  return 'Other';
}

const normTag = s => s.toLowerCase().replace(/[’']/g, "'").replace(/\s+/g, ' ').trim();

function buildGraph() {
  const nodes = [], edges = [], edgeKeys = new Set(), nodeMap = {}, tagIdMap = {};
  const usedSectors = new Set();

  function addNode(id, label, type, color, extra) {
    if (nodeMap[id] !== undefined) return;
    nodeMap[id] = nodes.length;
    nodes.push({ id, label: '', externalLabel: label, title: label, edgeCount: 0, color, nodeType: type,
      shape: 'dot', borderWidth: 2, ...extra });
  }
  function addEdge(from, to) {
    const k = from + '|' + to;
    if (edgeKeys.has(k)) return;
    edgeKeys.add(k);
    edges.push({ id: 'ed_' + edges.length, from, to });
    nodes[nodeMap[from]].edgeCount++;
    nodes[nodeMap[to]].edgeCount++;
  }

  RAW.forEach((item, idx) => {
    const eid = 'e_' + idx;
    const typeLabel = item.kind === 'person' ? 'Artist / Organisation' : 'Venue / Space';
    const title = `${item.name}\n[${typeLabel}]${item.contact ? '\nContact: ' + item.contact : ''}\n\n${item.about}`;
    addNode(eid, item.name, item.kind, item.kind === 'person' ? COLORS.person : COLORS.venue, { title, about: item.about });

    item.about.split(',').map(normTag).filter(Boolean).forEach(tag => {
      let tid = tagIdMap[tag];
      if (!tid) {
        tid = 't_' + Object.keys(tagIdMap).length;
        tagIdMap[tag] = tid;
        const sector = getSector(tag);
        usedSectors.add(sector);
        const display = tag.replace(/\b\w/g, c => c.toUpperCase());
        addNode(tid, display, 'tag', SECTOR_COLORS[sector], { title: `Practice: ${display}\nSector: ${sector}`, sector });
      }
      addEdge(eid, tid);
    });
  });

  // Bigger nodes, scaled by connectivity
  nodes.forEach(n => {
    const tag = n.nodeType === 'tag';
    n.size = Math.min;
    n.mass = 1 + n.edgeCount * 0.35;
  });

  // Seed positions on a wide golden-angle spiral (not a ring) so physics starts untangled
  nodes.forEach((n, i) => {
    const r = 70 * Math.sqrt(i + 1), a = i * 2.39996;
    n.x = Math.cos(a) * r; n.y = Math.sin(a) * r;
  });

  const legend = { 'Artist / Organisation': COLORS.person.background, 'Venue / Space': COLORS.venue.background };
  Object.keys(SECTOR_COLORS).forEach(s => { if (usedSectors.has(s)) legend[s] = SECTOR_COLORS[s].background; });

  return { nodes, edges, legend, stats: {
    people: RAW.filter(r => r.kind === 'person').length,
    venues: RAW.filter(r => r.kind === 'venue').length,
    tags: Object.keys(tagIdMap).length,
    connections: edges.length
  }};
}

document.addEventListener('DOMContentLoaded', function () {
  const root = document.getElementById('visnet-root');
  const container = root.querySelector('.visnet-container');
  const spinner = root.querySelector('.visnet-loading-spinner');
  const legendEl = root.querySelector('.visnet-legend');
  const fsControls = root.querySelector('.visnet-fullscreen-controls');
  const statsEl = document.getElementById('visnet-stats');
  const searchEl = root.querySelector('.visnet-search');

  let network, nodesDS, edgesDS;
  let focusSet = null;          // Set of node ids currently highlighted, or null
  
  const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const unlock = () => root.querySelectorAll('.visnet-btn, .visnet-select, .visnet-search').forEach(el => el.disabled = false);

  function showError(msg) {
    spinner.innerHTML = `<span class="visnet-error-text"><i class="fas fa-exclamation-triangle"></i> ${msg}</span>`;
    spinner.style.display = 'block';
  }

  // ---------- Labels: constant on-screen size, collision-avoided, priority = hubs first ----------
  function drawLabels(ctx, net, data, uiScale) {
    const scale = net.getScale();
    const pos = net.getPositions();
    const items = [];
    for (const id in pos) {
      const n = data.get(id);
      if (!n || (focusSet && !focusSet.has(id))) continue;
      const hi = focusSet && focusSet.root === id;
      items.push({ id, n, pri: (hi ? 1e6 : 0) + (n.nodeType === 'tag' ? n.edgeCount : 100 + n.size) });
    }
    items.sort((a, b) => b.pri - a.pri);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.lineJoin = 'round';
    const placed = [];
    items.forEach(({ id, n }) => {
      const tag = n.nodeType === 'tag';
      const px = (tag ? 12.5 : 15.5) * uiScale / scale;      // graph units => fixed screen size
      ctx.font = `${tag ? 500 : 700} ${px}px Inter, sans-serif`;
      const maxW = 130 * uiScale / scale, lines = [];
      let cur = '';
      n.externalLabel.split(' ').forEach(w => {
        if (cur && ctx.measureText(cur + ' ' + w).width > maxW) { lines.push(cur); cur = w; }
        else cur = cur ? cur + ' ' + w : w;
      });
      lines.push(cur);
      const w = Math.max(...lines.map(l => ctx.measureText(l).width));
      const h = lines.length * px * 1.2;
      const x = pos[id].x, y = pos[id].y + n.size + 3 * uiScale / scale, pad = 3 * uiScale / scale;
      const r = { l: x - w / 2 - pad, t: y - pad, r: x + w / 2 + pad, b: y + h + pad };
      if (placed.some(q => r.l < q.r && r.r > q.l && r.t < q.b && r.b > q.t)) return;
      placed.push(r);
      ctx.lineWidth = 4 * uiScale / scale;
      ctx.strokeStyle = 'rgba(255,255,255,0.93)';
      ctx.fillStyle = tag ? '#334155' : '#0f172a';
      lines.forEach((l, i) => {
        ctx.strokeText(l, x, y + i * px * 1.2);
        ctx.fillText(l, x, y + i * px * 1.2);
      });
    });
    ctx.restore();
  }

  // ---------- Highlight ----------
  function applyFocus(set) {
    focusSet = set;
    nodesDS.update(nodesDS.get().map(n => ({
      id: n.id,
      opacity: !set || set.has(n.id) ? 1 : 0.15
    })));
    edgesDS.update(edgesDS.get().map(e => ({
      id: e.id,
      color: !set ? { color: COLORS.edge }
        : (set.has(e.from) && set.has(e.to) && (e.from === set.root || e.to === set.root || !set.root))
          ? { color: '#1a56db' } : { color: 'rgba(148,163,184,0.08)' },
      width: set && (e.from === set.root || e.to === set.root) ? 2.5 : 1.4
    })));
    network.redraw();
  }

  function focusOn(id) {
    const s = new Set([id]);
    edgesDS.get().forEach(e => { if (e.from === id) s.add(e.to); if (e.to === id) s.add(e.from); });
    s.root = id;
    applyFocus(s);
  }

  function search(q) {
    q = q.trim().toLowerCase();
    if (!q) return applyFocus(null);
    const s = new Set();
    nodesDS.get().forEach(n => {
      if (n.externalLabel.toLowerCase().includes(q) || (n.about || '').toLowerCase().includes(q)) s.add(n.id);
    });
    if (!s.size) return applyFocus(new Set());
    const s2 = new Set(s);
    edgesDS.get().forEach(e => { if (s.has(e.from)) s2.add(e.to); if (s.has(e.to)) s2.add(e.from); });
    applyFocus(s2);
    network.fit({ nodes: [...s2], animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
  }

  // ---------- Render ----------
  function render(data) {
    nodesDS = new vis.DataSet(data.nodes);
    edgesDS = new vis.DataSet(data.edges);

    network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -120,
          centralGravity: 0.02,
          springLength: 150,
          springConstant: 0.06,
          damping: 0.6,
          avoidOverlap: 1
        },
        minVelocity: 0.75,
        stabilization: { iterations: 900, updateInterval: 50, fit: true }
      },
      nodes: {
        shape: 'dot',
        shadow: { enabled: true, size: 8, x: 0, y: 2, color: 'rgba(0,0,0,0.18)' },
        font: { size: 0 }
      },
      edges: {
        smooth: false,
        color: { color: COLORS.edge, highlight: '#1a56db', hover: '#1a56db' },
        width: 1.4,
        selectionWidth: 2.5
      },
      interaction: { hover: true, tooltipDelay: 80, hideEdgesOnDrag: false, zoomSpeed: 0.7 }
    });

    // Layout settles once, then freezes: nothing moves unless you drag a node.
    network.once('stabilizationIterationsDone', () => {
      network.setOptions({ physics: { enabled: false } });
      network.fit({ animation: false });
      spinner.style.display = 'none';
      unlock();
    });
    network.on('stabilizationProgress', p => {
      spinner.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Laying out network… ${Math.round(p.iterations / p.total * 100)}%`;
    });

    network.on('afterDrawing', ctx => drawLabels(ctx, network, nodesDS, 1));

    network.on('click', p => {
      if (p.nodes.length) focusOn(p.nodes[0]);
      else { searchEl.value = ''; applyFocus(null); }
    });

    legendEl.innerHTML = '<div class="legend-title">Legend</div>' + Object.entries(data.legend).map(([t, c]) =>
      `<div class="visnet-legend-item"><span class="visnet-legend-color" style="background:${c}"></span><span>${t}</span></div>`).join('');
    legendEl.style.display = 'block';

    const s = data.stats;
    statsEl.textContent = `${s.people} artists/orgs  ·  ${s.venues} venues/spaces  ·  ${s.tags} practices  ·  ${s.connections} connections`;

    setupListeners();
  }

  // ---------- A1 export ----------
  async function exportPoster(format) {
    if (!network) return;
    const isPDF = format === 'pdf';
    const selects = root.querySelectorAll('.visnet-export-select');
    selects.forEach(sel => sel.disabled = true);
    spinner.style.display = 'block';
    spinner.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Rendering ${isPDF ? 'PDF' : 'PNG'}…`;

    let hidden, expNet;
    try {
      const posterW = Math.round(594 * 300 / 25.4), posterH = Math.round(841 * 300 / 25.4);
      const positions = network.getPositions();
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      nodesDS.get().forEach(n => {
        const p = positions[n.id]; if (!p) return;
        const pad = n.size + 90;
        minX = Math.min(minX, p.x - pad); maxX = Math.max(maxX, p.x + pad);
        minY = Math.min(minY, p.y - pad); maxY = Math.max(maxY, p.y + pad);
      });
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const scale = Math.min(posterW * 0.95 / (maxX - minX), posterH * 0.95 / (maxY - minY));

      hidden = document.createElement('div');
      hidden.style.cssText = 'position:absolute;left:-99999px;top:-99999px;overflow:hidden';
      document.body.appendChild(hidden);
      const expContainer = document.createElement('div');
      expContainer.style.cssText = `width:${posterW}px;height:${posterH}px`;
      hidden.appendChild(expContainer);

      const expNodes = new vis.DataSet(nodesDS.get().map(n => ({
        ...n, x: positions[n.id].x, y: positions[n.id].y, fixed: true, opacity: 1 })));
      const expEdges = new vis.DataSet(edgesDS.get().map(e => ({ ...e, color: { color: 'rgba(144,164,174,0.55)' }, width: 1.8 })));
      focusSet = null;

      expNet = new vis.Network(expContainer, { nodes: expNodes, edges: expEdges }, {
        physics: { enabled: false },
        nodes: { shape: 'dot', shadow: { enabled: true, size: 14 }, font: { size: 0 } },
        edges: { smooth: false }
      });
      expNet.setSize(posterW + 'px', posterH + 'px');
      expNet.on('afterDrawing', ctx => drawLabels(ctx, expNet, expNodes, posterW / 1300));
      await new Promise(r => setTimeout(r, 200));
      expNet.moveTo({ position: { x: cx, y: cy }, scale, animation: false });
      await new Promise(r => setTimeout(r, 400));

      const graphCanvas = expContainer.querySelector('canvas');
      if (!graphCanvas) throw new Error('Canvas not found');
      const poster = document.createElement('canvas');
      poster.width = posterW; poster.height = posterH;
      const ctx = poster.getContext('2d', { alpha: false });
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(0, 0, posterW, posterH);
      ctx.drawImage(graphCanvas, 0, 0, posterW, posterH);
      ctx.strokeStyle = 'rgba(15,23,42,0.18)'; ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, posterW - 4, posterH - 4);
      ctx.fillStyle = 'rgba(15,23,42,0.45)'; ctx.font = '28px Inter, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Westmeath Arts & Creative Network', posterW / 2, posterH - 36);

      const stamp = Date.now();
      if (isPDF) {
        const pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a1' });
        pdf.addImage(poster.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 594, 841);
        pdf.save(`westmeath-arts-network-A1-${stamp}.pdf`);
      } else {
        const a = document.createElement('a');
        a.download = `westmeath-arts-network-A1-${stamp}.png`;
        a.href = poster.toDataURL('image/png');
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) {
      console.error('Export error:', e);
      showError('Export failed. Please try again.');
      return;
    } finally {
      if (expNet) expNet.destroy();
      if (hidden) hidden.remove();
      selects.forEach(sel => { sel.value = ''; sel.disabled = false; });
    }
    spinner.style.display = 'none';
  }

  function setupListeners() {
    root.querySelectorAll('.visnet-fit-btn').forEach(b =>
      b.addEventListener('click', () => network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } })));
    root.querySelectorAll('.visnet-export-select').forEach(sel =>
      sel.addEventListener('change', function () { if (this.value) exportPoster(this.value); }));
    root.querySelector('.visnet-clear-btn').addEventListener('click', () => { searchEl.value = ''; applyFocus(null); network.fit({ animation: true }); });
    searchEl.addEventListener('input', () => search(searchEl.value));

    root.querySelector('.visnet-fullscreen-btn').addEventListener('click', () => {
      if (!isFullscreen()) (container.requestFullscreen || container.webkitRequestFullscreen).call(container);
    });
    root.querySelector('.visnet-exit-fs-btn').addEventListener('click', () => {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    });
    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
      document.addEventListener(ev, () => {
        fsControls.style.display = isFullscreen() ? 'flex' : 'none';
        setTimeout(() => network.fit({ animation: false }), 100);
      }));
  }

  try {
    if (typeof vis === 'undefined') return showError('vis-network library failed to load.');
    render(buildGraph());
  } catch (err) {
    console.error(err);
    showError(err.message || 'Failed to build network');
  }
});
})();
</script>
</body>
</html>
